function knownCount(n){return Number.isSafeInteger(n)&&n>=0;}
function positiveCount(n){return knownCount(n)&&n>0;}
function countChip(n){return positiveCount(n)?`<span class="nav-count" aria-hidden="true">${n.toLocaleString('en-US')}</span>`:'';}
function topicNavigationModel(info,requested,held=null){
 // Unknown is not empty. Include-subtopics must remain reachable at a parent
 // even when all its artifacts live in descendants rather than directly here.
 const available=['subtopics','discussions','artifacts'].filter(tab=>tab==='discussions'||
  tab===held|| (tab==='subtopics'?info.subtopics!==0:info.artifacts!==0||info.branchArtifacts!==0));
 const preferred=info.subtopics===0?'discussions':'subtopics';
 const selected=available.includes(requested)?requested:preferred;
 return {available,selected:available.includes(selected)?selected:'discussions',showNavigation:available.length>1};
}
function topicViewIncludes(tab){
 if(topicBrowser.tab===tab)return tab==='artifacts'?library.include:topicBrowser.include;
 const saved=topicViewMemory.get(topicBrowser.area+':'+tab);
 return saved?new URLSearchParams(saved.split('?')[1]||'').get('descendants')==='1':false;
}
function topicNavigation(){
 const t=topicOf(topicBrowser.area);if(!t)return '';
 const info=topicInventory(t.id),model=topicNavigationModel(info,topicBrowser.tab,topicVisit?.tab);
 if(!model.showNavigation)return '';
 return `<nav class="topic-view-nav" aria-label="Topic views">${model.available.map(tab=>{
  const label={subtopics:'Subtopics',discussions:'Discussions',artifacts:'Artifacts'}[tab];
  const inc=tab!=='subtopics'&&topicViewIncludes(tab);
  const count=tab==='subtopics'?info.subtopics:tab==='discussions'?(inc?info.branchDiscussions:info.discussions):(inc?info.branchArtifacts:info.artifacts);
  const scope=tab==='subtopics'?'immediate subtopics':inc?'including subtopics':'directly in this topic';
  const described=positiveCount(count)?`${label}, ${count} ${scope}`:label;
  return `<a href="${topicViewHref(tab)}" data-topic-tab="${tab}" class="topic-view-link${topicBrowser.tab===tab?' active':''}" ${topicBrowser.tab===tab?'aria-current="page"':''} aria-label="${esc(described)}"><span>${label}</span>${countChip(count)}</a>`;
 }).join('')}</nav>`;
}

 if(id){const next=document.getElementById(id);next?.focus({preventScroll:true});if(next&&selection&&typeof next.setSelectionRange==='function')next.setSelectionRange(...selection);}

function createLocalTopic(){
 const form=$('#topic-create-form');if(!form)return;
 const parent=form.dataset.parent||null,name=$('#topic-name').value.trim(),description=$('#topic-description').value.trim();
 const error=$('#topic-create-error');
 const reject=(message,field)=>{error.hidden=false;error.textContent=message;field?.focus();};
 if(!canCreateTopic(parent))return reject('Your current role cannot create a topic here.');
 if(parent&&!TOPIC_MAP.has(parent))return reject('The parent topic is no longer available.');
 if(!name||name.length>120)return reject('Enter a name of up to 120 characters.',$('#topic-name'));
 if(!description||description.length>800)return reject('Enter a scope of up to 800 characters.',$('#topic-description'));
 if(TOPICS.some(t=>t.parentId===parent&&normalized(t.name)===normalized(name)))return reject('A topic with this name already exists under this parent.',$('#topic-name'));
 const id=LOCAL_TOPIC_PREFIX+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
 const record={id,name,parentId:parent,description};addTopic(id,name,parent,description);state.createdTopics.push(record);persist();
 closeModal();navigate(topicHref(id));showToast('Topic created.');
}
function restoreLocalTopics(){
 // Local fixture validation only. Persisted values never confer a role.
 let pending=Array.isArray(state.createdTopics)?state.createdTopics.filter(r=>r&&typeof r.id==='string'&&r.id.startsWith(LOCAL_TOPIC_PREFIX)&&typeof r.name==='string'&&typeof r.description==='string'):[];
 for(let pass=0;pass<100&&pending.length;pass++){
  const rest=[];let progress=false;
  for(const r of pending){if(TOPIC_MAP.has(r.id)){progress=true;continue;}if(r.parentId&&!TOPIC_MAP.has(r.parentId)){rest.push(r);continue;}addTopic(r.id,r.name.slice(0,120),r.parentId||null,r.description.slice(0,800));progress=true;}
  pending=rest;if(!progress)break;
 }
}
function removeLocalTopics(){
 for(let i=TOPICS.length-1;i>=0;i--)if(TOPICS[i].id.startsWith(LOCAL_TOPIC_PREFIX)){const t=TOPICS[i],parent=TOPIC_MAP.get(t.parentId);if(parent)parent.children=parent.children.filter(id=>id!==t.id);TOPIC_MAP.delete(t.id);TOPICS.splice(i,1);}
}

const normalized=s=>String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function matchesWords(text,query){return normalized(query).trim().split(/\s+/).filter(Boolean).every(w=>normalized(text).includes(w));}
function positivePage(value){const n=Number(value);return Number.isSafeInteger(n)&&n>0?n:1;}
function readTopicBrowser(){
 const t=topicOf(route.q.get('area')),hasArea=route.q.has('area');
 if(!t){topicVisit=null;return {area:'',invalid:hasArea,tab:'subtopics',query:route.q.get('q')||'',include:false,page:positivePage(route.q.get('page')),pageSize:[25,50].includes(Number(route.q.get('size')))?Number(route.q.get('size')):25};}
 const inventory=topicInventory(t.id),requested=['subtopics','discussions','artifacts'].includes(route.q.get('tab'))?route.q.get('tab'):(inventory.subtopics===0?'discussions':'subtopics');
 const held=topicVisit?.area===t.id&&topicVisit.tab===requested?requested:null;
 const model=topicNavigationModel(inventory,requested,held);
 if(model.selected!==requested){
  // An old bookmark to a known-empty optional collection opens the useful view.
  // Its query belonged to a different collection, so do not reuse it here.
  history.replaceState(null,'',topicHref(t.id,model.selected));route=parseRoute();
 }
 topicVisit={area:t.id,tab:model.selected};
 return {area:t.id,invalid:false,tab:model.selected,query:route.q.get('q')||'',include:route.q.get('descendants')==='1',page:positivePage(route.q.get('page')),pageSize:[25,50].includes(Number(route.q.get('size')))?Number(route.q.get('size')):25};
}

function topicRoute(overrides={}){
 const x={...topicBrowser,...overrides};const q=new URLSearchParams();
 if(x.area){q.set('area',x.area);q.set('tab',x.tab);}if(x.query)q.set('q',x.query);
 if(x.include&&x.tab!=='subtopics')q.set('descendants','1');if(x.page>1)q.set('page',x.page);if(x.pageSize!==25)q.set('size',x.pageSize);
 return '#/areas'+(q.size?'?'+q:'');
}

 // Each subject/view retains its own query and position while switching views.

}
const topicViewMemory=new Map();

function topicMatches(){const x=topicBrowser;

function topicPagination(total,page,size,label='topics'){

function topicDirectoryResults(){const all=topicMatches();const x=topicBrowser,pages=Math.max(1,Math.ceil(all.length/x.pageSize));x.page=Math.min(x.page,pages);const rows=all.slice((x.page-1)*x.pageSize,x.page*x.pageSize),searching=!!x.query.trim();

function topicDiscussionResults(){const x=topicBrowser,t=TOPIC_MAP.get(x.area);const all=Object.entries(DISCUSSIONS).filter(([id,d])=>(d.topicId===t.id||(x.include&&topicWithin(d.topicId,t.id,false)))&&matchesWords(d.title+' '+(d.body||'').replace(/<[^>]*>/g,' ')+' '+PEOPLE[d.author].name,x.query)).toSorted(([ia,a],[ib,b])=>discussionActivity(ib,b).at.localeCompare(discussionActivity(ia,a).at)||ia.localeCompare(ib));

function artifactLibraryView(scoped=false){

 library={query:route.q.get('q')||'',area:node?.id||'',format:route.q.get('format')||'',sort:route.q.get('sort')||'updated',page:positivePage(route.q.get('page')),pageSize:[12,24,48].includes(Number(route.q.get('size')))?Number(route.q.get('size')):12,include:route.q.get('descendants')==='1',scoped};

function matchingArtifacts(){
 const words=library.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
 return Object.entries(ARTIFACTS).filter(([id,a])=>words.every(w=>(a.title+' '+a.description+' '+a.path.join(' ')+' '+a.category+' '+PEOPLE[a.author].name+' '+(a.text||'')).toLowerCase().includes(w))&&(!library.area||a.topicId===library.area||(library.include&&topicWithin(a.topicId,library.area,false)))&&(!library.format||a.format===library.format)).sort(([id,a],[id2,b])=>library.sort==='title'?a.title.localeCompare(b.title)||id.localeCompare(id2):library.sort==='oldest'?a.sortTime.localeCompare(b.sortTime)||id.localeCompare(id2):b.sortTime.localeCompare(a.sortTime)||id.localeCompare(id2));
}

function artifactLocation(a){
 const chain=topicChain(a.topicId);
 if(library.area&&library.include){const index=chain.findIndex(t=>t.id===library.area);return index>=0?(chain.slice(index+1).map(t=>t.name).join(' › ')||'This topic'):chain.map(t=>t.name).join(' › ');}

function libraryResults(){
 const all=matchingArtifacts(),pages=Math.max(1,Math.ceil(all.length/library.pageSize));library.page=Math.min(library.page,pages);

function publish(){
 const draft=state.draft;if(!draft)return;
 if(draft.status==='unknown'){uncertainModal();return;}

  const current=getSummary(draft.d);
  if((current.revision||0)!==draft.expected){persist();conflictModal();return;}
  if(current.text&&!summaryEditors(draft.d).includes('maya')){showToast('You no longer have permission to edit this summary. Your draft is kept.');return;}
  const d=draft.d,next={text:draft.text,revision:(current.revision||0)+1,author:'maya',time:dateLabel(new Date(demoNow()).toISOString()),publishedAt:new Date(demoNow()).toISOString(),covered:[...(draft.includeAll?draft.snapshot:draft.covered)],scope:'discussion'};
  recordSummary(d,next);state.draft=null;persist();closeModal();shownSummary=null;
  render({preserveScroll:true});showToast(summaryPresentation(d).featured?'Summary updated.':'Summary saved as a snapshot.');return;

async function recoverOutcome(retry=false,automatic=false){

 // Simulated bounded status operation: no real network/server call is made.
 await new Promise(resolve=>setTimeout(resolve,180));
 if(state.draft?.attempt!==attempt){checkingAttempt=null;return;}
 const result=state.scenario==='status-unavailable'?null:retry?commitReply(draft):state.outcomes[attempt];
 checkingAttempt=null;
 if(!result){
  buttons.filter(b=>b.isConnected).forEach(b=>b.disabled=false);
  const status=$('.recovery-message')||$('#recovery-check-status');if(status)status.textContent='Still unable to confirm. Your reply is kept.';

 }

 // Ownership of the active route/dialog is checked even in this local example.
 if(route.raw===origin){
  if(dialogWasOpen&&$('#modal').open&&$('#modal-title')?.textContent===dialogTitle)closeModal();
  render({preserveScroll:true});
  showToast('Your reply was posted.');

 }
}

 if(event.key==='Escape'&&$('.sidebar')?.classList.contains('open')){$('[data-a="close-nav"]')?.click();}
});
$('#modal').addEventListener('cancel',()=>{requestAnimationFrame(()=>{if(modalOpener?.isConnected)modalOpener.focus({preventScroll:true});});});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=$('#modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
window.addEventListener('hashchange',()=>{const next=parseRoute();if(next.view==='artifact'&&(route?.id!==next.id||route?.q.get('rev')!==next.q.get('rev')))artifactTab='overview';render();syncSidebar();});
function syncSidebar(){const side=$('.sidebar');if(side)side.inert=matchMedia('(max-width:760px)').matches&&!side.classList.contains('open');}
let wasNarrow=matchMedia('(max-width:760px)').matches;
window.addEventListener('resize',()=>{const narrow=matchMedia('(max-width:760px)').matches;if(narrow!==wasNarrow){wasNarrow=narrow;render({preserveScroll:true});}syncSidebar();});
// A pending timer must not override a manual mark-unread action.
const originalSetRead=setRead;
setRead=function(key,on,feedback=true){if(on&&!feedback&&(state.manualUnread||[]).includes(key))return;originalSetRead(key,on,feedback);};
window.addEventListener('online',()=>{if(state.draft?.status==='unknown')recoverOutcome(false,true);});
restoreLocalTopics();
render();syncSidebar();


document.addEventListener('keydown',event=>{
 const side=$('.sidebar');
 if(event.key==='Tab'&&side?.classList.contains('open')&&!$('#modal').open){
  const focusable=$$('a[href],button:not(:disabled)',side).filter(x=>x.getClientRects().length);
  const first=focusable[0],last=focusable.at(-1);
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
 }
});

try{history.scrollRestoration='manual';}catch{}
window.addEventListener('scroll',()=>{if(route&&route.raw===(location.hash.slice(1)||'/updates'))scrollPositions.set(route.raw,window.scrollY);},{passive:true});

</script>
</body>
