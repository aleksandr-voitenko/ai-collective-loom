name: Bootstrap and application checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_failure_upload:
        description: Run controlled browser failures to verify artifact upload (run must fail)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Check bootstrap JavaScript syntax
        run: find scripts tests/bootstrap tests/integration -name '*.mjs' -print0 | xargs -0 -n 1 node --check
      - run: bash -n infra/postgres/10-roles.sh && bash -n infra/postgres/start.sh

  local-integration:
    needs: checks
    runs-on: ubuntu-24.04
    # Budget the complete sequential coverage run, reporting, smoke and persistence.
    # Individual test deadlines, worker count and retries remain in their runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare browser diagnostic status
        run: node scripts/prepare-browser-diagnostics.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run dev:init
      - run: npm run dev:doctor
      - run: npm run dev:up
      - run: npm run app:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-diagnostics
      - name: Combined coverage and regression suites
        id: coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: npm run coverage
      - name: Preserve line and branch coverage reports
        if: always() && steps.coverage.outputs.ready == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: coverage/approved/
          if-no-files-found: error
          retention-days: 3
      - name: Exercise controlled browser failure before upload
        if: github.event_name == 'workflow_dispatch' && inputs.verify_failure_upload
        run: npm run test:e2e -- --config tests/diagnostics/playwright.config.ts
      - name: Validate browser diagnostic upload candidate
        id: browser_diagnostics
        if: always()
        run: node scripts/approve-browser-diagnostics.mjs
      - name: Preserve approved browser diagnostics
        if: always() && steps.browser_diagnostics.outputs.ready == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: browser-diagnostics/approved/*.json
          if-no-files-found: error
          retention-days: 3
      - run: npm run test:integration
      - run: npm run test:persistence
      - name: Show local image IDs
        if: always()
        run: npm run dev:images
      - name: Stop the ephemeral runner's local services
        if: always()
        run: npm run dev:down
